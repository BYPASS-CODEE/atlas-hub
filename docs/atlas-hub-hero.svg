<svg width="1440" height="620" viewBox="0 0 1440 620" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Atlas Hub product overview</title>
  <desc id="desc">A dark technical product illustration showing the Atlas Hub workspace, connected business modules and secure API architecture.</desc>
  <rect width="1440" height="620" rx="28" fill="#080D1D"/>
  <path d="M0 520H1440" stroke="#1B2742"/>
  <path d="M0 100H1440" stroke="#1B2742"/>
  <path d="M90 510C310 390 430 460 620 340C805 222 1000 318 1345 120" stroke="#4F46E5" stroke-width="2" stroke-dasharray="8 14" opacity=".48">
    <animate attributeName="stroke-dashoffset" from="0" to="-88" dur="5s" repeatCount="indefinite"/>
  </path>
  <circle cx="620" cy="340" r="7" fill="#818CF8">
    <animate attributeName="r" values="7;12;7" dur="2.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;.45;1" dur="2.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1000" cy="318" r="5" fill="#34D399">
    <animate attributeName="r" values="5;10;5" dur="2.8s" repeatCount="indefinite"/>
  </circle>

  <text x="92" y="116" fill="#A5B4FC" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="3">ATLAS HUB / OPERATIONS PLATFORM</text>
  <text x="92" y="178" fill="#F8FAFC" font-family="Arial, sans-serif" font-size="48" font-weight="700">One workspace for the work</text>
  <text x="92" y="220" fill="#94A3B8" font-family="Arial, sans-serif" font-size="20">Clients · Projects · Tasks · Support · Finance · Teams</text>

  <rect x="92" y="274" width="276" height="148" rx="18" fill="#111A31" stroke="#2A395B"/>
  <circle cx="126" cy="310" r="15" fill="#312E81"/>
  <path d="M119 310H133M126 303V317" stroke="#C7D2FE" stroke-width="2" stroke-linecap="round"/>
  <text x="155" y="316" fill="#F8FAFC" font-family="Arial, sans-serif" font-size="18" font-weight="700">Workspace</text>
  <text x="120" y="357" fill="#94A3B8" font-family="Arial, sans-serif" font-size="15">Organizations &amp; access</text>
  <text x="120" y="387" fill="#34D399" font-family="Arial, sans-serif" font-size="14">● Protected by RBAC</text>

  <rect x="402" y="274" width="276" height="148" rx="18" fill="#111A31" stroke="#2A395B"/>
  <circle cx="436" cy="310" r="15" fill="#064E3B"/>
  <path d="M428 311L434 317L445 304" stroke="#6EE7B7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="465" y="316" fill="#F8FAFC" font-family="Arial, sans-serif" font-size="18" font-weight="700">Delivery</text>
  <text x="430" y="357" fill="#94A3B8" font-family="Arial, sans-serif" font-size="15">Projects &amp; task flow</text>
  <text x="430" y="387" fill="#818CF8" font-family="Arial, sans-serif" font-size="14">● Clear operational visibility</text>

  <rect x="712" y="274" width="276" height="148" rx="18" fill="#111A31" stroke="#2A395B"/>
  <circle cx="746" cy="310" r="15" fill="#78350F"/>
  <path d="M738 304H753V317H738V304Z" stroke="#FCD34D" stroke-width="2"/>
  <text x="775" y="316" fill="#F8FAFC" font-family="Arial, sans-serif" font-size="18" font-weight="700">Finance</text>
  <text x="740" y="357" fill="#94A3B8" font-family="Arial, sans-serif" font-size="15">Invoices &amp; payments</text>
  <text x="740" y="387" fill="#FBBF24" font-family="Arial, sans-serif" font-size="14">● Structured business records</text>

  <rect x="1022" y="274" width="326" height="148" rx="18" fill="#111A31" stroke="#2A395B"/>
  <circle cx="1056" cy="310" r="15" fill="#172554"/>
  <path d="M1049 310C1049 306 1052 303 1056 303C1060 303 1063 306 1063 310C1063 314 1060 317 1056 317C1052 317 1049 314 1049 310Z" stroke="#93C5FD" stroke-width="2"/>
  <text x="1085" y="316" fill="#F8FAFC" font-family="Arial, sans-serif" font-size="18" font-weight="700">Secure API layer</text>
  <text x="1050" y="357" fill="#94A3B8" font-family="Arial, sans-serif" font-size="15">JWT · Express · SQLite</text>
  <text x="1050" y="387" fill="#60A5FA" font-family="Arial, sans-serif" font-size="14">● Organization-scoped access</text>

  <rect x="92" y="492" width="1256" height="64" rx="14" fill="#0D152A" stroke="#253352"/>
  <text x="124" y="532" fill="#64748B" font-family="Arial, sans-serif" font-size="14" letter-spacing="2">FULL-STACK</text>
  <text x="270" y="532" fill="#CBD5E1" font-family="Arial, sans-serif" font-size="16">React + TypeScript</text>
  <text x="530" y="532" fill="#334155" font-family="Arial, sans-serif" font-size="20">/</text>
  <text x="580" y="532" fill="#CBD5E1" font-family="Arial, sans-serif" font-size="16">Node.js + Express REST API</text>
  <text x="900" y="532" fill="#334155" font-family="Arial, sans-serif" font-size="20">/</text>
  <text x="950" y="532" fill="#CBD5E1" font-family="Arial, sans-serif" font-size="16">SQLite relational database</text>
  <circle cx="1298" cy="524" r="6" fill="#34D399"><animate attributeName="opacity" values="1;.35;1" dur="1.8s" repeatCount="indefinite"/></circle>
</svg>
